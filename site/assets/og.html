<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>og</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&family=Rubik:wght@600..900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;background:#fff;color:#000;font-family:'Figtree',sans-serif;overflow:hidden}
.card{position:relative;width:1200px;height:630px;display:grid;grid-template-columns:minmax(0,1fr) 310px}
.left{padding:54px 0 0 64px;display:flex;flex-direction:column}
.on{display:flex;align-items:center;gap:12px;font:600 24px/1 'Figtree';color:#4b4b54}
.on img{height:44px;width:auto}
h1{margin-top:30px;font:900 124px/1 'Rubik';letter-spacing:-.025em;white-space:nowrap}
h1 span{background:linear-gradient(transparent 64%,#ff87a6 64%,#ff87a6 90%,transparent 90%);padding:0 10px;margin:0 -10px}
.tag{margin-top:30px;max-width:720px;font:600 38px/1.25 'Figtree';color:#000}
.by{margin-top:auto;margin-bottom:56px;display:flex;align-items:center;gap:26px}
.by b{font:800 30px/1 'Rubik'}
.by b u{text-decoration:none;border-bottom:5px solid #ff87a6}
.mini{position:relative;width:300px;height:30px}
.mini::before{content:"";position:absolute;left:0;right:0;top:13px;height:5px;border-radius:5px;background:#dcdce2}
.mini i{position:absolute;top:15px;border-radius:50%}
.mini .seg{left:126px;width:60px;height:14px;top:8px;border-radius:14px;background:rgba(255,135,166,.38)}
.mini .dot{left:126px;width:26px;height:26px;margin:-13px 0 0 -13px;top:15px;background:#ff87a6}
.mini .ring{left:186px;width:26px;height:26px;margin:-13px 0 0 -13px;top:15px;border:5px solid #000;box-shadow:0 0 0 3px #fff}
.right{position:relative;background:#ff87a6;overflow:hidden}
.disc{position:absolute;left:50%;top:50%;width:270px;height:270px;margin:-120px 0 0 -135px;border-radius:50%;background:#fff}
.right img{position:absolute;left:50%;bottom:14px;height:520px;width:auto;transform:translateX(-50%)}
.bar{position:absolute;left:0;right:0;bottom:0;height:14px;background:#000}
</style></head>
<body><div class="card">
  <div class="left">
    <div class="on">Markets on <img src="og/xo-wordmark-black.png" alt="XO"></div>
    <h1><span>PL Fair Price</span></h1>
    <p class="tag">What every Premier League market on XO should cost, priced from the markets with real money.</p>
    <div class="by"><b><u>by @CryptoTan01</u></b><div class="mini"><i class="seg"></i><i class="dot"></i><i class="ring"></i></div></div>
  </div>
  <div class="right"><div class="disc"></div><img src="og/deek-og.png" alt="Deek"></div>
  <div class="bar"></div>
</div></body></html>
